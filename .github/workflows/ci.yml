name: CI and delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: make backend-check

  frontend:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Browser tests and container delivery
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aira:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start and check the exact image to deliver
        env:
          AIRA_IMAGE: aira:${{ github.sha }}
        run: |
          docker run --detach --name aira-check --publish 127.0.0.1:8000:8000 "$AIRA_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live
          test "$(curl --silent --output /tmp/aira-ready.json --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)" = 503
          python3 -c 'import json; r=json.load(open("/tmp/aira-ready.json")); assert r["ready"] is False and r["provider"]["status"] == "unverified" and r["missing_prerequisites"]'
      - run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test the built container in a browser
        env:
          AIRA_E2E_EXTERNAL_SERVER: '1'
        run: npm --prefix frontend run test:e2e
      - name: Save logs
        if: always()
        run: docker logs aira-check > container.log 2>&1 || true
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            container.log
          retention-days: 7
      - name: Package tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AIRA_IMAGE: aira:${{ github.sha }}
          AIRA_REVISION: ${{ github.sha }}
        run: |
          mkdir delivery
          docker save "$AIRA_IMAGE" | gzip > delivery/aira-linux-amd64.tar.gz
          cp scripts/DELIVERY.md delivery/README.md
          printf '%s\n' "$AIRA_REVISION" > delivery/REVISION
          cd delivery
          sha256sum aira-linux-amd64.tar.gz > SHA256SUMS
      - name: Deliver tested container
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aira-linux-amd64-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Stop container
        if: always()
        run: docker rm --force aira-check || true
