[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aira"
version = "0.1.0"
description = "Source-grounded prior authorization evidence workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2,<3",
  "pdfplumber>=0.11,<0.12",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.2.4",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.13.1",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-ra --strict-markers"
markers = ["live: explicitly invoked tests that require live OpenAI access"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
